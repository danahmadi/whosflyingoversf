<!doctype html><html><head><meta charset="utf-8"><title>Who's flying over SF?</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:-apple-system,system-ui,Helvetica,Arial,sans-serif;margin:0;background:#f4f7fb;color:#1b2430}
header{padding:24px 32px 8px}h1{margin:0;font-size:28px}h1 span{color:#2a7de1}.sub{color:#667;margin-top:4px}
.wrap{display:flex;gap:24px;padding:16px 32px 32px;align-items:flex-start;flex-wrap:wrap}
.cal{background:#fff;border-radius:14px;box-shadow:0 2px 10px #0001;padding:18px;flex:1;min-width:640px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav button{border:0;background:#eef3fa;border-radius:8px;padding:8px 14px;font-size:16px;cursor:pointer}.nav button:disabled{opacity:.3}
.nav h2{margin:0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-size:12px;color:#889;text-align:center;font-weight:600}
.day{min-height:84px;border-radius:10px;background:#f8fafc;padding:6px;position:relative;cursor:default}
.day.has{background:#fff;border:1px solid #dde6f2;cursor:pointer}.day.has:hover{border-color:#2a7de1}
.day.sel{outline:2px solid #2a7de1}.day.empty{background:transparent}
.num{font-size:12px;color:#889}.logos{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.logo{width:34px;height:34px;border-radius:8px;object-fit:contain;background:#fff;box-shadow:0 0 0 1px #e3e8ef}
.badge{width:34px;height:34px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.unk{opacity:.8}.med{opacity:.75}
.side{width:300px}.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px #0001;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}.leg{display:flex;align-items:center;gap:10px;margin:6px 0}.leg .logo,.leg .badge{width:26px;height:26px}
.leg b{flex:1}.cnt{color:#667;font-size:13px}
.det a{display:block;font-size:13px;color:#2a7de1;word-break:break-all;margin:3px 0}.det .t{font-family:monospace;background:#eef3fa;padding:2px 6px;border-radius:4px}
.det .entry{border-top:1px solid #eee;padding-top:8px;margin-top:8px}.small{font-size:12px;color:#889}
.logo,.badge{cursor:pointer}
#ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}
#ov.on{display:flex}#md{background:#fff;border-radius:16px;max-width:620px;width:92%;max-height:86vh;overflow:auto;padding:22px;position:relative}
#md .x{position:absolute;top:10px;right:14px;border:0;background:none;font-size:26px;cursor:pointer;color:#667}
.co{display:flex;gap:14px;align-items:center;background:#f4f7fb;border-radius:12px;padding:12px;margin:10px 0}.co .logo,.co .badge{width:48px;height:48px}
.ev{border-top:1px solid #eee;padding:8px 0;font-size:14px}.pill{font-size:11px;padding:2px 7px;border-radius:9px;background:#eef3fa;margin-left:6px}
.pill.high{background:#d8f5e3}.pill.medium{background:#fff1cc}.thumb{font-size:12px;color:#889}
</style></head><body>
<header><h1>Who's flying <span>over SF?</span></h1><div class="sub"><span style="float:right"><a href="map.html" style="color:#2a7de1;margin-right:14px">Map →</a><a href="fly.html" style="color:#2a7de1;margin-right:14px">Fly a banner →</a><a href="stats.html" style="color:#2a7de1">Statistics →</a></span>Brands towing aerial banners over San Francisco — from public posts</div></header>
<div class="wrap"><div class="cal"><div class="nav"><button id="prev">‹</button><h2 id="mt"></h2><button id="next">›</button></div><div class="grid" id="g"></div></div>
<div class="side"><div class="card det" id="det"><h3>Pick a day</h3><div class="small">Click a day with a logo to see the brand, banner text and sources.</div></div>
<div class="card"><h3>Advertisers <span class="small">(days seen)</span></h3><div id="leg"></div><div class="small" style="margin-top:8px">Faded = medium confidence. Grey "?" = unidentified banner.</div></div></div></div>
<div id="ov"><div id="md"><button class="x" aria-label="Close">×</button><div id="mc"></div></div></div><script>
const D=__DATA__;const months=D.months;let mi=months.length-1;
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function icon(b,cls=""){const B=D.brands[b]||D.brands.Unknown;if(B.logo){const i=document.createElement("img");i.src=B.logo;i.className="logo "+cls;i.title=b;i.onerror=()=>i.replaceWith(badge(b,cls));return i}return badge(b,cls)}
function badge(b,cls){const s=document.createElement("div");s.className="badge "+cls;s.style.background=(D.brands[b]||D.brands.Unknown).color;s.textContent=b=="Unknown"?"?":b[0];s.title=b;return s}
function render(){const[y,m]=months[mi];document.getElementById("mt").textContent=MN[m]+" "+y;prev.disabled=mi==0;next.disabled=mi==months.length-1;
const g=document.getElementById("g");g.innerHTML="";"Sun Mon Tue Wed Thu Fri Sat".split(" ").forEach(d=>{const e=document.createElement("div");e.className="dow";e.textContent=d;g.appendChild(e)});
const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement("div");e.className="day empty";g.appendChild(e)}
for(let d=1;d<=n;d++){const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;const e=document.createElement("div");e.className="day";e.innerHTML=`<div class="num">${d}</div>`;
const v=D.days[key];if(v){e.classList.add("has");const L=document.createElement("div");L.className="logos";Object.entries(v).sort((a,b)=>(a[0]=="Unknown")-(b[0]=="Unknown")).forEach(([b,x])=>{const ic=icon(b,b=="Unknown"?"unk":(x.conf=="medium"?"med":""));ic.onclick=ev=>{ev.stopPropagation();modal(key,b)};L.appendChild(ic)});e.appendChild(L);
e.onclick=()=>{document.querySelectorAll(".sel").forEach(s=>s.classList.remove("sel"));e.classList.add("sel");show(key,v)}}g.appendChild(e)}}
function show(k,v){const det=document.getElementById("det");det.innerHTML=`<h3>${new Date(k+"T12:00").toDateString()}</h3>`;
for(const[b,x]of Object.entries(v)){const w=document.createElement("div");w.className="entry";const h=document.createElement("div");h.className="leg";{const ic=icon(b);ic.onclick=()=>modal(k,b);h.appendChild(ic)}h.insertAdjacentHTML("beforeend",`<b>${(D.brands[b]||{}).label||b}</b><span class="cnt">${x.conf}</span>`);w.appendChild(h);
if(x.texts.length)w.insertAdjacentHTML("beforeend",`<div>Banner: <span class="t">${x.texts.map(t=>t.replace(/</g,"&lt;")).join(" / ")}</span></div>`);
x.sources.forEach(s=>{if(s.url){const a=document.createElement("a");a.href=s.url;a.target="_blank";a.textContent=s.label+" — "+s.note;w.appendChild(a)}else w.insertAdjacentHTML("beforeend",`<div class="small">${s.label}: ${s.note}</div>`)});det.appendChild(w)}}
function legend(){const c={};for(const v of Object.values(D.days))for(const b in v)c[b]=(c[b]||0)+1;const L=document.getElementById("leg");
Object.entries(c).sort((a,b)=>b[1]-a[1]).forEach(([b,n])=>{const r=document.createElement("div");r.className="leg";r.appendChild(icon(b));r.insertAdjacentHTML("beforeend",`<b>${(D.brands[b]||{}).label||b}</b><span class="cnt">${n} day${n>1?"s":""}</span>`);L.appendChild(r)})}

function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function modal(k,b){const x=D.days[k][b],B=D.brands[b]||D.brands.Unknown,mc=document.getElementById("mc");mc.innerHTML="";
mc.insertAdjacentHTML("beforeend",`<div class="small">${new Date(k+"T12:00").toDateString()}</div><h2 style="margin:4px 0">${esc(B.label)} <span class="pill ${x.conf}">${x.conf} confidence</span></h2>`);
if(x.texts.length)mc.insertAdjacentHTML("beforeend",`<div>Banner text: <span class="t" style="font-family:monospace;background:#eef3fa;padding:2px 6px;border-radius:4px">${x.texts.map(esc).join(" / ")}</span></div>`);
const co=document.createElement("div");co.className="co";co.appendChild(icon(b));co.insertAdjacentHTML("beforeend",`<div><b>${esc(B.label)}</b>${B.url?` · <a href="${B.url}" target="_blank">${esc(B.url.replace(/^https?:\/\//,""))}</a>`:""}<div class="small" style="color:#445;margin-top:4px">${esc(B.desc)}</div></div>`);mc.appendChild(co);
if(x.flights){x.flights.forEach(i=>{const f=D.flights[i];mc.insertAdjacentHTML("beforeend",`<div class="co" style="display:block"><b>✈ ADS-B flight ${esc(f.tail)}</b> · ${f.start}–${f.end} PT · ${f.hours_over_sf} h over SF (${f.airborne_hours} h airborne) · ~${f.median_kt} kt, ~${f.median_alt_ft} ft${f.match=="ambiguous"?`<div class=small>Several brands seen this day: ${f.candidates.join(", ")} — attribution uncertain</div>`:f.match=="none"?"":`<div class=small>Brand matched from same-day sightings (${f.match})</div>`}<div id="mm${i}" style="height:200px;border-radius:8px;margin-top:8px"></div></div>`);setTimeout(()=>{if(!window.L)return;const m=L.map("mm"+i,{attributionControl:false,zoomControl:false});L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(m);const pl=L.polyline(f.track,{color:B.color||"#2a7de1",weight:2}).addTo(m);m.fitBounds(pl.getBounds())},50)})}
if(x.detected)mc.insertAdjacentHTML("beforeend",`<div class="warn" style="background:#fff7e0;border-radius:10px;padding:10px">Flight detected, brand unknown. <a href="mailto:hello@sfbannerplanes.com?subject=Banner%20on%20${k}">Know which brand? Submit →</a></div>`);
if(x.noflight)mc.insertAdjacentHTML("beforeend",`<div class=small style="margin-top:6px">⚠ No matching ADS-B flight found for this day among tracked tails.</div>`);
mc.insertAdjacentHTML("beforeend",`<h3 style="margin:12px 0 4px;font-size:15px">Evidence (${x.sources.length})</h3>`);
x.sources.forEach(s=>{mc.insertAdjacentHTML("beforeend",`<div class="ev"><b>${esc(s.label)}</b><span class="pill ${s.conf}">${s.conf}</span>${s.img?' <span class="thumb">📷 has photo</span>':""}<div>${esc(s.note||"")}</div>${s.url?`<a href="${s.url}" target="_blank" style="font-size:13px;word-break:break-all">${esc(s.url)}</a>`:""}</div>`)});
document.getElementById("ov").classList.add("on")}
function closeM(){document.getElementById("ov").classList.remove("on")}
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
document.querySelector("#md .x").onclick=closeM;document.getElementById("ov").onclick=e=>{if(e.target.id=="ov")closeM()};
prev.onclick=()=>{mi--;render()};next.onclick=()=>{mi++;render()};
const h=location.hash.match(/(\d{4})-(\d{2})(?:-(\d{2}))?(?::(.+))?/);if(h){const i=months.findIndex(([y,m])=>y==+h[1]&&m==+h[2]-1);if(i>=0)mi=i}
legend();render();if(h&&h[3]&&h[4]){const k=`${h[1]}-${h[2]}-${h[3]}`;if(D.days[k]&&D.days[k][decodeURIComponent(h[4])])modal(k,decodeURIComponent(h[4]))}
</script></body></html>
