name: Report a sighting
description: Saw a banner plane over SF? Tell us.
title: "Sighting: <date> <brand>"
labels: [sighting]
body:
  - type: input
    id: date
    attributes: {label: Date (PT), description: "The day you saw the banner, not the day a post went up. Say unsure if you do not know.", placeholder: "2026-10-14 or unsure"}
    validations: {required: true}
  - type: input
    id: neighborhood
    attributes: {label: Neighborhood / location, placeholder: "Mission Bay, San Francisco"}
    validations: {required: true}
  - type: input
    id: brand
    attributes: {label: Brand / advertiser, placeholder: "Unknown if unsure"}
  - type: input
    id: text
    attributes: {label: Banner text (exactly as written)}
  - type: input
    id: url
    attributes: {label: Source URL (post, article, thread)}
  - type: textarea
    id: photo
    attributes: {label: Photo, description: "Drag and drop a photo you have permission to share. Please avoid private details about bystanders."}
  - type: textarea
    id: notes
    attributes: {label: Where/when, description: Neighborhood, time of day, anything else}
